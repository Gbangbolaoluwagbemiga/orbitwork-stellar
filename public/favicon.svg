<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pg" cx="38%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#04040f"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Space background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Orbit ring — back half (behind planet) -->
  <path d="M 3,16 A 13,4.2 0 0,1 29,16"
        fill="none" stroke="#6366f1" stroke-width="0.8"
        stroke-dasharray="2.5 1.8" opacity="0.45"/>

  <!-- Planet -->
  <circle cx="16" cy="16" r="6.5" fill="url(#pg)" filter="url(#pglow)"/>

  <!-- Orbit ring — front half (in front of planet) -->
  <path d="M 3,16 A 13,4.2 0 0,0 29,16"
        fill="none" stroke="#818cf8" stroke-width="0.9" opacity="0.7"/>

  <!-- Orbiting satellite -->
  <circle r="2.2" fill="#06b6d4" filter="url(#glow)">
    <animateMotion dur="3.6s" repeatCount="indefinite"
      path="M 29,16 A 13,4.2 0 0,0 3,16 A 13,4.2 0 0,0 29,16"/>
  </circle>
</svg>
