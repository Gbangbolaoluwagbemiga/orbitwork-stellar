<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pg" cx="38%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#04040f"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Orbit back half (dashed, behind planet) -->
  <path d="M 3,16 A 13,4.2 0 0,1 29,16"
        fill="none" stroke="#6366f1" stroke-width="0.9"
        stroke-dasharray="2.5 1.8" opacity="0.5"/>

  <!-- Planet -->
  <circle cx="16" cy="16" r="6.5" fill="url(#pg)"/>

  <!-- Orbit front half (solid, in front of planet) -->
  <path d="M 3,16 A 13,4.2 0 0,0 29,16"
        fill="none" stroke="#818cf8" stroke-width="1" opacity="0.75"/>

  <!-- Satellite — animateMotion on a <g> wrapper, no filter, rotate="none" -->
  <g>
    <animateMotion dur="3.6s" repeatCount="indefinite" rotate="none"
      path="M 29,16 A 13,4.2 0 0,0 3,16 A 13,4.2 0 0,0 29,16"/>
    <circle r="2.4" fill="#06b6d4"/>
  </g>
</svg>
