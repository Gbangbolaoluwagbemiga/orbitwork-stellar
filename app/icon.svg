<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @keyframes orbit {
      from { offset-distance: 0%; }
      to   { offset-distance: 100%; }
    }
    .sat {
      offset-path: path("M 29,16 A 13,4.2 0 0,0 3,16 A 13,4.2 0 0,0 29,16");
      offset-rotate: 0deg;
      animation: orbit 3.6s linear infinite;
    }
  </style>
  <defs>
    <radialGradient id="pg" cx="38%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#04040f"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <path d="M 3,16 A 13,4.2 0 0,1 29,16"
        fill="none" stroke="#6366f1" stroke-width="0.8"
        stroke-dasharray="2.5 1.8" opacity="0.45"/>

  <circle cx="16" cy="16" r="6.5" fill="url(#pg)"/>

  <path d="M 3,16 A 13,4.2 0 0,0 29,16"
        fill="none" stroke="#818cf8" stroke-width="0.9" opacity="0.7"/>

  <circle class="sat" cx="0" cy="0" r="2.3" fill="#06b6d4" filter="url(#glow)"/>
</svg>
